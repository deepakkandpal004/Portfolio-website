<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#05070c"/>
  <defs>
    <pattern id="jdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444" opacity="0.65"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#jdots)"/>

  <!-- Header -->
  <text x="60" y="72" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" letter-spacing="4" fill="#f59e0b" font-weight="600">SYSTEM ARCHITECTURE</text>

  <!-- Observability -->
  <rect x="560" y="84" width="480" height="76" rx="14" fill="#0d1420" stroke="#2a3342" stroke-width="1.5"/>
  <text x="800" y="114" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="600" fill="#e8ebf1">Prometheus + Grafana</text>
  <text x="800" y="138" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" fill="#8b93a3">metrics &#183; dashboards &#183; alerts</text>
  <line x1="700" y1="288" x2="700" y2="164" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrGray)"/>
  <line x1="940" y1="288" x2="940" y2="164" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrGray)"/>
  <text x="820" y="232" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8f98a8">metrics</text>

  <!-- Main flow nodes -->
  <g font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
    <rect x="60" y="292" width="150" height="76" rx="14" fill="#0d1420" stroke="#2a3342" stroke-width="1.5"/>
    <text x="135" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#e8ebf1">Client</text>
    <text x="135" y="346" text-anchor="middle" font-size="11.5" fill="#8b93a3">producer</text>

    <rect x="280" y="292" width="180" height="76" rx="14" fill="#0d1420" stroke="#2a3342" stroke-width="1.5"/>
    <text x="370" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#e8ebf1">Express API</text>
    <text x="370" y="346" text-anchor="middle" font-size="11.5" fill="#8b93a3">REST &#183; TypeScript</text>

    <rect x="530" y="292" width="180" height="76" rx="14" fill="#0d1420" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="620" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#e8ebf1">Redis</text>
    <text x="620" y="346" text-anchor="middle" font-size="11.5" fill="#8b93a3">queue + streams</text>

    <rect x="780" y="292" width="180" height="76" rx="14" fill="#0d1420" stroke="#2a3342" stroke-width="1.5"/>
    <text x="870" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#e8ebf1">Workers</text>
    <text x="870" y="346" text-anchor="middle" font-size="11.5" fill="#8b93a3">leases + heartbeats</text>

    <rect x="1030" y="292" width="190" height="76" rx="14" fill="#0d1420" stroke="#2a3342" stroke-width="1.5"/>
    <text x="1125" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#e8ebf1">PostgreSQL</text>
    <text x="1125" y="346" text-anchor="middle" font-size="11.5" fill="#8b93a3">job store &#183; Prisma</text>
  </g>

  <!-- Flow arrows -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8f98a8">
    <line x1="214" y1="330" x2="276" y2="330" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="245" y="314" text-anchor="middle">POST /jobs</text>
    <line x1="464" y1="330" x2="526" y2="330" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="495" y="314" text-anchor="middle">enqueue</text>
    <line x1="714" y1="330" x2="776" y2="330" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="745" y="314" text-anchor="middle">lease</text>
    <line x1="964" y1="330" x2="1026" y2="330" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="995" y="314" text-anchor="middle">persist</text>
  </g>

  <!-- DLQ branch -->
  <line x1="620" y1="372" x2="620" y2="448" stroke="#ef4444" stroke-opacity="0.65" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="634" y="416" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8f98a8">retries exhausted</text>
  <rect x="530" y="452" width="180" height="64" rx="14" fill="#0d1420" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="620" y="478" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#e8ebf1">DLQ</text>
  <text x="620" y="500" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11.5" fill="#8b93a3">manual retry</text>

  <!-- Footer caption -->
  <text x="640" y="650" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" letter-spacing="2" fill="#6b7280">IDEMPOTENCY KEYS &#183; FENCING TOKENS &#183; DOCKER COMPOSE</text>
</svg>
